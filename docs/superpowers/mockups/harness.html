<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>海报调试页</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#DADDE2;font:13px/1.6 -apple-system,'PingFang SC',sans-serif;padding:24px;color:#333}
.row{display:flex;flex-wrap:wrap;gap:24px}.cell{width:540px}
canvas{width:540px;height:720px;display:block;box-shadow:0 18px 50px rgba(20,25,35,.22);border-radius:4px;background:#fff}
.cap{margin-top:8px;color:#555}#log{white-space:pre-wrap;color:#a00;margin-top:12px}
</style></head><body>
<p>用小程序里的同一份 <code>utils/poster</code> 源码，在浏览器 canvas 上出图（宽 1080，缩到一半显示）。wx 只模拟了离屏 canvas；数字字体用本地 Inter 子集，和云存储上的是同一份文件。</p>
<div id="log"></div>
<script>
// ---- 极简 CommonJS：同步拉源码，按相对路径解析 require ----
const _mods = {};
function _resolve(from, p) {
  const parts = from.split('/'); parts.pop();
  p.split('/').forEach(s => { if (s === '..') parts.pop(); else if (s !== '.') parts.push(s); });
  let r = parts.join('/'); if (!/\.js$/.test(r)) r += '.js'; return r;
}
function requireAt(file) {
  if (_mods[file]) return _mods[file].exports;
  const x = new XMLHttpRequest(); x.open('GET', '/repo/' + file, false); x.send();
  if (x.status !== 200) throw new Error('load fail ' + file);
  const module = { exports: {} }; _mods[file] = module;
  new Function('module', 'exports', 'require', x.responseText + '\n//# sourceURL=' + file)(module, module.exports, p => requireAt(_resolve(file, p)));
  return module.exports;
}
// ---- 模拟 wx：离屏 canvas ----
window.wx = { createOffscreenCanvas: ({ width, height }) => { const c = document.createElement('canvas'); c.width = width; c.height = height; c.createImage = () => new Image(); return c; } };

const log = m => { document.getElementById('log').textContent += m + '\n'; };
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });

async function main() {
  const poster = requireAt('utils/poster/index.js');
  const model = requireAt('utils/poster/model.js');
  const tint = requireAt('utils/poster/tint.js');
  // 数字字体：和云存储同一份文件
  let fontsReady = false;
  try {
    for (const w of ['500', '700', '800']) {
      const ff = new FontFace('PosterNum', `url(/repo/cloudfunctions/uploadStaticAssets/assets/poster_fonts/inter-${w}.woff2)`, { weight: w });
      document.fonts.add(await ff.load());
    }
    fontsReady = true;
  } catch (e) { log('字体加载失败：' + e.message); }
  await document.fonts.load('900 40px "Noto Sans SC"');

  const films = await (await fetch('films.json')).json();
  const by = t => films.find(f => f.title === t);
  const entry = (f, date, ts, extra) => Object.assign({
    date, ts, title: f.title, year: f.year, director: f.dir, genres: f.genres, poster: f ? 'covers/' + f.id + '.jpg' : '',
    rating: 0, note: '', moodEmoji: '', moodLabel: '', platformRatings: []
  }, extra || {});

  const CASES = [
    { cap: '完整：评分 + 三栏平台评分 + 短评 + 第 N 部', ordinal: 37,
      e: entry(by('千与千寻'), '2026-10-18', 1, { rating: 5, note: '不要回头，一直往前走。', platformRatings: [{ label: '豆瓣', value: '9.4' }, { label: 'IMDb', value: '8.6' }, { label: '新鲜度', value: '96%' }] }) },
    { cap: '长片名、没评分有心情、无短评、无平台评分、无序号', ordinal: null,
      e: entry(by('牯岭街少年杀人事件'), '2026-09-02', 2, { moodEmoji: '🥲', moodLabel: '想哭' }) },
    { cap: '四栏平台评分 + 三行长短评（封面被压缩）', ordinal: 120,
      e: entry(by('花样年华'), '2026-10-04', 3, { rating: 4, note: '那个时代已过去，属于那个时代的一切都不存在了。王家卫把一段没有说出口的感情拍成了一场漫长的雨，旗袍一件件换，人一次次错过，最后只剩吴哥窟墙上的一个洞。', platformRatings: [{ label: '豆瓣', value: '8.8' }, { label: 'IMDb', value: '8.1' }, { label: '新鲜度', value: '92%' }, { label: '爆米花', value: '93%' }] }) },
    { cap: '没有封面（占位）', ordinal: 5,
      e: Object.assign(entry({ title: '一部很冷门的片', year: '1987', dir: '某导演', genres: ['剧情'] }, '2026-08-11', 4, { rating: 3 }), { poster: '' }) }
  ];

  // ?layouts=ticket,magazine：只画这几个版式（默认全部单部版式）；?full=N：只画第 N 个用例，按原尺寸 1080 显示
  const q = new URLSearchParams(location.search);
  const full = q.get('full');
  const ids = (q.get('layouts') || poster.available('single').filter(id => id !== 'classic').join(',')).split(',');
  if (full != null) { document.querySelector('style').textContent += '.cell{width:1080px}canvas{width:1080px;height:auto}'; }
  const logEl = document.getElementById('log');
  for (const id of ids) {
    const h = document.createElement('h3'); h.textContent = poster.NAMES[id] || id; document.body.insertBefore(h, logEl);
    const row = document.createElement('div'); row.className = 'row'; document.body.insertBefore(row, logEl);
    for (const c of (full != null ? [CASES[+full]] : CASES)) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const canvas = document.createElement('canvas');
      cell.appendChild(canvas);
      const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = c.cap; cell.appendChild(cap);
      row.appendChild(cell);
      try {
        const m = model.fromDailySingle(c.e, { ordinal: c.ordinal });
        const layout = poster.get(id);
        const size = layout.measure(m);
        canvas.width = size.width; canvas.height = size.height;
        const node = c.e.poster ? await loadImg(c.e.poster) : null;
        const covers = { [m.film.key]: node };
        const tints = { [m.film.key]: await tint.prepareTint(node) };
        const t0 = performance.now();
        layout.draw(canvas.getContext('2d'), m, covers, { s: 1, fontsReady, tints });
        cap.textContent += `（绘制 ${Math.round(performance.now() - t0)}ms）`;
      } catch (e) { log(id + ' / ' + c.cap + '：' + (e.stack || e)); }
    }
  }
}
main().catch(e => log(e.stack || e));
</script></body></html>
